export default "<div class=\"chart-wrapper\">\n  <div class=\"bars\">\n    <div class=\"bar-col\" *ngFor=\"let m of data\">\n      <div class=\"bar-track\">\n        <div class=\"bar\" [style.height.%]=\"barHeight(m.count)\" [title]=\"m.count + ' bookings'\"></div>\n      </div>\n      <span class=\"bar-value\">{{ m.count }}</span>\n      <span class=\"bar-label\">{{ m.month }}</span>\n    </div>\n  </div>\n</div>\n";
