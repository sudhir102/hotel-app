export default "<div class=\"map-container\">\n  <iframe\n    *ngIf=\"mapUrl\"\n    [src]=\"mapUrl\"\n    width=\"100%\"\n    height=\"220\"\n    frameborder=\"0\"\n    scrolling=\"no\">\n  </iframe>\n  <div class=\"coords\">Lat: {{ latitude | number:'1.4-4' }}, Lng: {{ longitude | number:'1.4-4' }}</div>\n</div>\n";
